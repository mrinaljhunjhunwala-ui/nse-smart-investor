# NSE Pro theme — makes Streamlit's native widgets (buttons, sliders, selectboxes,
# radios, tabs, links) adopt the saffron + navy palette. The custom CSS in app.py
# layers on top of this. Without this block, native widgets stay default-blue.
[theme]
base                     = "dark"
primaryColor             = "#ff9500"
backgroundColor          = "#070c18"
secondaryBackgroundColor = "#0d1526"
textColor                = "#f0f4ff"
font                     = "sans serif"

[server]
headless = true
# FIX CFG1 — production hardening for Streamlit Cloud:
#  * runOnSave: default is true, which triggers a full app rerun on every file
#    write. Harmless in dev, wasteful in prod where the "file" doesn't change
#    while a viewer is on the page.
#  * enableXsrfProtection defaults on; explicit for auditability.
runOnSave            = false
enableXsrfProtection = true

[browser]
# The default gathers usage metrics from every viewer of the app and forwards
# them to a third party. Off in prod.
gatherUsageStats = false

# Hide Streamlit's auto-generated pages/ navigation — the app ships its own
# grouped sidebar nav in dashboard/shared/nav.py (render_sidebar). Without this,
# users would see TWO navigations stacked in the sidebar.
[client]
showSidebarNavigation = false
