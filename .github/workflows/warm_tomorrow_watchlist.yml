name: Warm Tomorrow's Watchlist

# FIX W-SPEED. Runs the Tomorrow's Watchlist EOD scan once after market close
# and persists it to trade_store (Postgres) so every visit to that page reads
# an instant snapshot instead of paying the cold-scan cost on whichever visit
# happens to hit an expired in-app cache — exactly the same fix
# warm-top-picks.yml already applies to Command Centre's Top Picks, just
# extended to this page. Requires DATABASE_URL to point at the SAME Postgres
# instance configured in the Streamlit Cloud app's secrets — see
# dashboard/DB_SETUP.md. If DATABASE_URL isn't set, trade_store falls back to
# a local SQLite file only this ephemeral runner can see, which would make
# this workflow a no-op for the deployed app (it still won't fail the job —
# see scripts/warm_tomorrow_watchlist.py).
#
# This is an EOD/next-session scan (not intraday), so it only needs to run
# once after close, not every 15 min like Top Picks. NSE closes 15:30 IST =
# 10:00 UTC; running at 10:20 UTC (15:50 IST) gives a buffer for the day's
# final close prints to settle at the data providers before scoring runs.
#
# timeout-minutes is deliberately generous (20, not 8) — an earlier version
# of the sibling Top Picks workflow was set to 8 and was repeatedly getting
# cancelled mid-scan once Stooq degraded for a run (every ticker paying a
# ~4s Stooq timeout tax before falling through to Yahoo). That's now fixed
# at the root with a circuit breaker in data/fetcher.py, but this timeout
# still leaves headroom rather than re-creating the same failure mode here.

on:
  # No GitHub schedule (removed 2026-10-02): cron-job.org triggers this via
  # workflow_dispatch (alerts/README.md). GitHub's cron fired hours late and
  # only cost Actions minutes.
  workflow_dispatch:           # allow manual "Run workflow" from the Actions tab

concurrency:
  group: warm-tomorrow-watchlist
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Needs the fuller dependency set (same reasoning as warm-top-picks.yml)
      # because it imports dashboard.shared.cache, which pulls in streamlit
      # and plotly at module import time even though this job never renders
      # a UI.
      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Run Tomorrow's Watchlist warm-up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional — set these only if you want the scan to use real-time
          # Angel One prices instead of the free Stooq/Yahoo fallback chain:
          ANGEL_API_KEY:      ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID:    ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD:     ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET:  ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python scripts/warm_tomorrow_watchlist.py

      # After-close Telegram/Gmail message with the top breakout and reversal
      # names from the snapshot just written. Shares the alert-state cache
      # with the other alert jobs, so it goes out at most once a day.
      - name: Restore alert state
        id: restore_state
        uses: actions/cache/restore@v5
        with:
          path: data/alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - name: Send Tomorrow's Watchlist
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_GMAIL_ADDRESS:      ${{ secrets.ALERT_GMAIL_ADDRESS }}
          ALERT_GMAIL_APP_PASSWORD: ${{ secrets.ALERT_GMAIL_APP_PASSWORD }}
          ALERT_GMAIL_TO:           ${{ secrets.ALERT_GMAIL_TO }}
          DATABASE_URL:             ${{ secrets.DATABASE_URL }}
        run: python alerts/check_alerts.py --mode=tomorrow-watchlist

      # Fridays only (the mode checks the weekday): how this week's BUY /
      # STRONG BUY reads moved since they were logged, vs the Nifty.
      - name: Send weekly report card
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_GMAIL_ADDRESS:      ${{ secrets.ALERT_GMAIL_ADDRESS }}
          ALERT_GMAIL_APP_PASSWORD: ${{ secrets.ALERT_GMAIL_APP_PASSWORD }}
          ALERT_GMAIL_TO:           ${{ secrets.ALERT_GMAIL_TO }}
          DATABASE_URL:             ${{ secrets.DATABASE_URL }}
        run: python alerts/check_alerts.py --mode=weekly-scorecard

      # Why today's biggest gainers and losers moved (results, announcements,
      # sector, volume) and whether each was on the app's lists beforehand.
      - name: Send why the top movers moved
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_GMAIL_ADDRESS:      ${{ secrets.ALERT_GMAIL_ADDRESS }}
          ALERT_GMAIL_APP_PASSWORD: ${{ secrets.ALERT_GMAIL_APP_PASSWORD }}
          ALERT_GMAIL_TO:           ${{ secrets.ALERT_GMAIL_TO }}
          DATABASE_URL:             ${{ secrets.DATABASE_URL }}
        run: python alerts/check_alerts.py --mode=why-moved

      # After-close portfolio posture from the Angel One holdings. Used to need
      # its own cron-job.org trigger at 14:00 (never set up); it rides this
      # post-close job instead. --always sends a one-line "all steady" note
      # when nothing needs attention, so there is a portfolio text every day.
      - name: Send portfolio after the close
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_GMAIL_ADDRESS:      ${{ secrets.ALERT_GMAIL_ADDRESS }}
          ALERT_GMAIL_APP_PASSWORD: ${{ secrets.ALERT_GMAIL_APP_PASSWORD }}
          ALERT_GMAIL_TO:           ${{ secrets.ALERT_GMAIL_TO }}
          DATABASE_URL:             ${{ secrets.DATABASE_URL }}
          ANGEL_API_KEY:      ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID:    ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD:     ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET:  ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python alerts/check_alerts.py --mode=portfolio-posture --always

      - name: Save alert state
        if: always() && steps.restore_state.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: data/alert_state.json
          key: alert-state-${{ github.run_id }}
