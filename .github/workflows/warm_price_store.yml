name: Warm Price Store

# Nightly Angel One -> daily_bars fill (scripts/warm_price_store.py). Bulk scans
# (~750 names) used to read Yahoo only, because Angel One's candle API answers
# 403 "exceeding access rate" above ~90 calls/min when the app hits it from 16
# scan threads. This job asks Angel once per symbol after the close, at a hard
# throttle (ANGEL_BULK_RPS, default 1.4 req/s), and stores the bars in the
# daily_bars table; data.fetcher.fetch_single serves daily history from there
# (Tier 0.5) before Yahoo when it is fresh. Requires DATABASE_URL to point at
# the SAME Postgres the Streamlit Cloud app uses — see dashboard/DB_SETUP.md.
# Without it trade_store falls back to a SQLite file only this ephemeral runner
# sees, which makes the job a no-op for the deployed app (it still won't fail).
#
# Intended time: 18:30 IST Mon–Fri (cron-job.org job #11, alerts/README.md),
# well after the 15:30 close so Angel's ONE_DAY candle for the day is final.
# First run backfills ANGEL_BACKFILL_DAYS (default 2000 = one request per
# symbol); later runs fetch only the new session. A second run the same
# evening is a no-op. ~750 names at 1.4 req/s is ~9 min; each rate-limit hit
# costs a 65 s pause, hence the 45-min timeout. The app reads the store only
# while the market is closed (data/price_store.py).

on:
  # No GitHub schedule: cron-job.org triggers this via workflow_dispatch
  # (alerts/README.md). GitHub's cron fired hours late and only cost Actions
  # minutes.
  workflow_dispatch:           # allow manual "Run workflow" from the Actions tab

concurrency:
  group: warm-price-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-24.04
    env:
      PRICE_STORE_PATH: data/price_store.db
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The price store is its own SQLite file (data/price_store.py), filled nightly by
      # warm_price_store.yml and kept in the Actions cache (it used up Neon's free transfer).
      - name: Restore price store
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data/price_store.db
          key: price-store-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            price-store-

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet --prefer-binary -r requirements.txt

      - name: Fill the price store from Angel One
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANGEL_API_KEY:      ${{ secrets.ANGEL_API_KEY }}
          # Optional: a second SmartAPI app key used by every Actions job, so its
          # candle quota is not shared with the live app.
          ANGEL_HIST_API_KEY: ${{ secrets.ANGEL_HIST_API_KEY }}
          ANGEL_CLIENT_ID:    ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD:     ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET:  ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/warm_price_store.py --telegram

      - name: Save price store
        if: always() && hashFiles('data/price_store.db') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data/price_store.db
          key: price-store-${{ github.run_id }}-${{ github.run_attempt }}
