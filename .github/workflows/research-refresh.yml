name: Research Refresh (score efficacy + regime study)

# Manually-triggered only — this is an occasional, deliberate re-run of the
# two read-only research scripts, not part of every push/PR.
#
# WHY THIS EXISTS: SCORE_EFFICACY_REPORT.md and REGIME_STUDY_REPORT.md were
# both committed 2026-06-10, but the walk-forward loop in both
# research/score_efficacy.py and research/regime_study.py raised
# AttributeError on cs.pattern_score on EVERY sample (analysis/score.py
# removed that field in the pattern-removal migration) until FIX EFF1 landed
# 2026-07-07 — nearly a month later. Neither report reflects a run of the
# current scoring logic. Local sandboxes (both the maintainer's and Claude's)
# lack outbound access to Yahoo Finance / Stooq / NSE, so a real run has to
# happen here, where that network access already exists (see
# market-alerts.yml, which hits the same providers on a schedule).
#
# This job does NOT rewrite the .md reports automatically — it only produces
# the raw CSVs + console output as a downloadable artifact. Turning those
# numbers into report prose/conclusions is a separate, deliberate step.

on:
  workflow_dispatch:

concurrency:
  group: research-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt

      # tee needs research/output/ to exist before either script's own
      # os.makedirs() call runs (that happens after arg-parsing, inside
      # main() — too late for tee's own file-open).
      - name: Create output directory
        run: mkdir -p research/output

      # Full universe (no --limit) for both — docstrings estimate a few
      # minutes and ~4-6 min respectively; timeout-minutes above gives a
      # wide margin for Yahoo/Stooq retries and rate-limit backoff, which
      # this repo's own test logs show can be substantial some days.
      - name: Run score efficacy study
        run: python -m research.score_efficacy 2>&1 | tee research/output/score_efficacy_console.log

      - name: Run regime study
        run: python -m research.regime_study 2>&1 | tee research/output/regime_study_console.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-output-${{ github.run_id }}
          path: research/output/
          retention-days: 30
