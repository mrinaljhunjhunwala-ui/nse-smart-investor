name: Movers Evidence

# Weekly rebuild of the movers radar's "similar past moves" table
# (scripts/build_movers_evidence.py -> KV movers_evidence). A late GitHub cron
# fire is harmless here: the table changes slowly. Run it once by hand after
# merging so the radar has a record from day one.

on:
  schedule:
    - cron: "17 4 * * 0"       # Sunday ~09:47 IST
  workflow_dispatch:

concurrency:
  group: movers-evidence
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PRICE_STORE_PATH: data/price_store.db
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The price store is its own SQLite file (data/price_store.py), filled nightly by
      # warm_price_store.yml and kept in the Actions cache (it used up Neon's free transfer).
      - name: Restore price store
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data/price_store.db
          key: price-store-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            price-store-

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install --quiet --prefer-binary -r requirements.txt

      - name: Build the movers evidence table
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUTF8: "1"
        run: python scripts/build_movers_evidence.py
