name: Market Alerts

# 2026-09-09 re-registration nudge: last scheduled fire was 2026-09-08 12:16
# UTC, then the cron went silent. Suspected cause: GitHub's scheduler paused
# the cron after 4 rapid workflow-file modifications on the sibling
# market-digest.yml in the same 24-hour window. Touching this file forces
# re-registration on the next default-branch push.
#
# Runs every 15 minutes during NSE market hours and sends Telegram alerts
# for custom price levels, portfolio holdings (from the My Portfolio page),
# VIX fear/panic regimes, and Nifty downtrends.
#
# NSE hours 09:15–15:30 IST = 03:45–10:00 UTC. GitHub cron is UTC-only and
# can't express :45, so we run 03–10 UTC and the script self-guards on the
# exact IST window (and skips weekends).
#
# 2026-09-28: GitHub's cron was only firing ~2 of ~26 slots/day (often
# after close). The primary trigger is now an EXTERNAL scheduler
# (cron-job.org) calling workflow_dispatch every 15 min — see
# alerts/README.md "Reliable 15-minute cadence". The schedule below is kept
# only as a best-effort fallback; duplicate fires are harmless because the
# concurrency group serialises runs and alert_state.json de-dups per day. Other
# workflows (market-digest, warm jobs) share that state through the cache but run
# in their own groups, so check_alerts also merges it through KV "alert_state".

on:
  # No GitHub schedule (removed 2026-10-02): cron-job.org triggers this via
  # workflow_dispatch (alerts/README.md). GitHub's cron fired hours late and
  # only cost Actions minutes.
  workflow_dispatch:               # external 15-min trigger + manual "Run workflow"

# Avoid overlapping runs if one is slow
concurrency:
  group: market-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    # Postgres outage fallback (19 Nov 2026, Neon transfer quota): if the database refuses,
    # trade_store writes this SQLite file instead; it is cached between runs and uploaded.
    env:
      STORE_FALLBACK_PATH: data/store_fallback.db
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore database fallback file
        uses: actions/cache/restore@v5
        with:
          path: data/store_fallback.db
          key: store-fallback-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            store-fallback-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # pyotp: Angel One TOTP login. Without it angel_fetcher fails with
      # "No module named 'pyotp'" and every fetch falls back to Yahoo.
      # yfinance + beautifulsoup4: the Screener and Yahoo tiers of
      # fetch_quarterly_figures. Without them every intraday results read
      # failed ("beautifulsoup4 not installed" / "No module named 'yfinance'")
      # whenever the NSE results list came back empty.
      # bse: the BSE tier of nse_announcements / bse_corp_info. Without it every run
      # logged "`bse` package unavailable", so when NSE's API and RSS both returned
      # 403 (17 Nov) the catalyst and holding-guard checks saw no filings at all.
      - name: Install minimal deps
        run: >-
          pip install --quiet pandas numpy requests "pyotp>=2.8.0,<2.12" "psycopg2-binary>=2.9.0,<3.0"
          "yfinance>=1.0,<2" "beautifulsoup4>=4.12.0,<5.0" "lxml>=4.9.0,<7.0" "bse>=3.3.3,<4.0"

      # Persist the de-dup state file between runs so the same alert
      # isn't re-sent every 15 minutes. New cache each run, restore latest.
      - name: Restore alert state
        uses: actions/cache/restore@v5
        with:
          path: data/alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - name: Run alert checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # Holdings alerts (avg-cost / ±10% / levels on holdings) are off
          # unless the repo variable ALERT_HOLDINGS is set to 1.
          ALERT_HOLDINGS:     ${{ vars.ALERT_HOLDINGS }}
          # Portfolio alerts read the My Portfolio holdings (and persist their
          # reference prices) in the same Postgres the dashboard uses.
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          # Task 4.1 (added 2026-09-08): Gmail SMTP as the second alert
          # channel alongside Telegram. Requires GitHub Actions secrets:
          #   ALERT_GMAIL_ADDRESS       - your Gmail address
          #   ALERT_GMAIL_APP_PASSWORD  - 16-char app password from
          #                               myaccount.google.com/apppasswords
          #                               (NOT your real Gmail password)
          #   ALERT_GMAIL_TO            - recipient (usually same as address)
          # If any of the three is unset, GmailAlerter falls through to
          # console-fallback and this workflow still succeeds - the Telegram
          # channel picks up the load.
          ALERT_GMAIL_ADDRESS:      ${{ secrets.ALERT_GMAIL_ADDRESS }}
          ALERT_GMAIL_APP_PASSWORD: ${{ secrets.ALERT_GMAIL_APP_PASSWORD }}
          ALERT_GMAIL_TO:           ${{ secrets.ALERT_GMAIL_TO }}
          # Optional - set these only if you want real-time Angel One prices
          # instead of the 15-min-delayed Yahoo fallback:
          ANGEL_API_KEY:      ${{ secrets.ANGEL_API_KEY }}
          ANGEL_HIST_API_KEY: ${{ secrets.ANGEL_HIST_API_KEY }}
          ANGEL_CLIENT_ID:    ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD:     ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET:  ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python alerts/check_alerts.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/alert_state.json
          key: alert-state-${{ github.run_id }}

      # Only present when Postgres refused this run (or an earlier one); see trade_store.
      - name: Save database fallback file
        if: always() && hashFiles('data/store_fallback.db') != ''
        uses: actions/cache/save@v5
        with:
          path: data/store_fallback.db
          key: store-fallback-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload database fallback file
        if: always() && hashFiles('data/store_fallback.db') != ''
        uses: actions/upload-artifact@v6
        with:
          name: store-fallback-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/store_fallback.db
          retention-days: 30
